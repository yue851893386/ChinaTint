<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一纸山河 ChinaTint · 中国地级市可编辑地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; height:100vh; overflow:hidden; }
  #map { flex:1; background:#f5f7fa; }
  #panel { width:320px; min-width:280px; background:#fff; border-left:1px solid #e4e7ed; display:flex; flex-direction:column; }
  .p-head { padding:14px 16px; border-bottom:1px solid #ebeef5; }
  .p-head h1 { font-size:16px; color:#303133; }
  .p-head .sub { font-size:12px; color:#909399; margin-top:4px; }
  #authBar { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:#606266; }
  #authBar .spacer { flex:1; }
  #status { font-size:12px; color:#409eff; padding:8px 16px; border-bottom:1px solid #ebeef5; }
  #status button { margin-left:8px; padding:2px 10px; font-size:11px; }
  .p-body { flex:1; overflow-y:auto; padding:12px 16px; }
  .sec-title { font-size:13px; font-weight:600; color:#606266; margin:12px 0 8px; }
  .sec-title:first-child { margin-top:0; }
  #selInfo { font-size:13px; color:#303133; background:#f4f4f5; border-radius:6px; padding:10px 12px; line-height:1.7; }
  #selInfo .none { color:#c0c4cc; }
  .palette { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .swatch { width:26px; height:26px; border-radius:5px; cursor:pointer; border:2px solid transparent; transition:transform .1s; }
  .swatch:hover { transform:scale(1.15); border-color:#303133; }
  .row { display:flex; gap:8px; margin-top:10px; align-items:center; }
  input[type=color] { width:42px; height:32px; border:1px solid #dcdfe6; border-radius:6px; padding:2px; cursor:pointer; background:#fff; }
  input[type=text], input[type=password], select { padding:8px 10px; border:1px solid #dcdfe6; border-radius:6px; font-size:13px; outline:none; background:#fff; }
  input[type=text]:focus, input[type=password]:focus, select:focus { border-color:#409eff; }
  button { font-size:12px; padding:7px 12px; border:1px solid #dcdfe6; background:#fff; border-radius:6px; cursor:pointer; color:#606266; white-space:nowrap; }
  button:hover { color:#409eff; border-color:#409eff; }
  button.primary { background:#409eff; color:#fff; border-color:#409eff; }
  button.primary:hover { background:#66b1ff; }
  button.danger:hover { color:#f56c6c; border-color:#f56c6c; }
  #search { width:100%; padding:8px 10px; border:1px solid #dcdfe6; border-radius:6px; font-size:13px; outline:none; }
  #search:focus { border-color:#409eff; }
  #cityList { margin-top:8px; max-height:260px; overflow-y:auto; border:1px solid #ebeef5; border-radius:6px; }
  .city-item { display:flex; align-items:center; gap:8px; padding:7px 10px; font-size:13px; color:#303133; cursor:pointer; border-bottom:1px solid #f5f7fa; }
  .city-item:hover { background:#ecf5ff; }
  .city-item.active { background:#409eff; color:#fff; }
  .city-item .dot { width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.15); flex-shrink:0; }
  .city-item .code { margin-left:auto; font-size:11px; color:#c0c4cc; }
  .city-item.active .code { color:#fff; }
  #projList { margin-top:8px; border:1px solid #ebeef5; border-radius:6px; max-height:180px; overflow-y:auto; }
  .proj-item { display:flex; align-items:center; gap:6px; padding:7px 10px; font-size:13px; border-bottom:1px solid #f5f7fa; }
  .proj-item .pname { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .proj-item .ptime { font-size:11px; color:#c0c4cc; }
  .proj-item button { padding:3px 8px; font-size:11px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .p-foot { padding:10px 16px; border-top:1px solid #ebeef5; font-size:11px; color:#c0c4cc; line-height:1.6; }
  #count { color:#67c23a; }
  /* 地图顶部检索 */
  #mapSearch { position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:500; width:340px; }
  #mapSearchInput { width:100%; padding:9px 14px; border:1px solid #dcdfe6; border-radius:8px; font-size:13px; outline:none; box-shadow:0 2px 8px rgba(0,0,0,.08); background:#fff; }
  #mapSearchInput:focus { border-color:#409eff; }
  #searchDrop { display:none; margin-top:6px; background:#fff; border:1px solid #ebeef5; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.12); max-height:280px; overflow-y:auto; }
  .search-item { display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:13px; color:#303133; cursor:pointer; }
  .search-item.active, .search-item:hover { background:#ecf5ff; }
  .search-item .dot { width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,.15); flex-shrink:0; }
  .search-item .code { margin-left:auto; font-size:11px; color:#c0c4cc; }
  .search-empty { padding:10px 12px; font-size:12px; color:#c0c4cc; text-align:center; }
  /* 省/市标注（permanent tooltip，直接挂在图层组上） */
  .lbl-prov, .lbl-city { background:transparent !important; border:none !important;
                         box-shadow:none !important; padding:0 !important; pointer-events:none; }
  .lbl-prov:before, .lbl-city:before { display:none !important; }
  .lbl-prov { font-size:13px; font-weight:700; color:#1f2329; letter-spacing:1px;
              text-shadow:-1px 0 2px #fff, 0 1px 2px #fff, 1px 0 2px #fff, 0 -1px 2px #fff; }
  .lbl-city { font-size:10px; color:#374151;
              text-shadow:-1px 0 2px #fff, 0 1px 2px #fff, 1px 0 2px #fff, 0 -1px 2px #fff; }
  /* 登录弹窗 */
  #authModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000; align-items:center; justify-content:center; }
  #authModal.show { display:flex; }
  .auth-box { background:#fff; border-radius:10px; padding:24px; width:320px; }
  .auth-box h2 { font-size:16px; margin-bottom:16px; color:#303133; }
  .auth-box input { width:100%; margin-bottom:10px; }
  .auth-box .row { justify-content:space-between; margin-top:4px; }
  #authMsg { font-size:12px; color:#f56c6c; min-height:16px; margin-top:6px; }
</style>
</head>
<body>
<div id="map">
  <div id="mapSearch">
    <input id="mapSearchInput" type="text" autocomplete="off"
           placeholder="🔍 检索城市：输入名称或 adcode，回车定位（↑↓ 选择）">
    <div id="searchDrop"></div>
  </div>
</div>
<div id="panel">
  <div class="p-head">
    <h1>一纸山河</h1>
    <div class="sub">ChinaTint · 中国地级市可编辑地图 · v4.1</div>
    <div id="authBar">
      <span id="authStatus">未登录（可本地编辑）</span>
      <span class="spacer"></span>
      <button id="loginBtn">登录</button>
      <button id="registerBtn">注册</button>
      <button id="logoutBtn" style="display:none">退出</button>
    </div>
  </div>
  <div id="status">正在加载 GeoJSON…</div>
  <div class="p-body">
    <div class="sec-title">云端项目（登录后可保存 / 再次编辑）</div>
    <div class="row">
      <input type="text" id="projName" placeholder="项目名称，如：2026销售分布" style="flex:1;min-width:0">
      <button class="primary" id="saveProjBtn">保存</button>
    </div>
    <div id="projList"><div class="proj-item" style="color:#c0c4cc">登录后显示已保存的项目</div></div>

    <div class="sec-title">当前选中</div>
    <div id="selInfo"><span class="none">在地图或列表中点击一个城市</span></div>

    <div class="sec-title">配色</div>
    <div class="palette" id="palette"></div>
    <div class="row">
      <input type="color" id="customColor" value="#409eff">
      <button class="primary" id="applyBtn">应用自定义颜色</button>
      <button class="danger" id="clearBtn">清除颜色</button>
    </div>

    <div class="sec-title">城市列表（<span id="count">0</span>）</div>
    <input id="search" placeholder="过滤下方城市列表…">
    <div id="cityList"></div>

    <div class="sec-title">导入 / 导出</div>
    <div class="btns">
      <button id="exportBtn">导出配色 JSON</button>
      <button id="importBtn">导入配色 JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
    <div class="btns" style="margin-top:8px">
      <button id="randomBtn">随机配色</button>
      <button class="danger" id="clearAllBtn">清空全部配色</button>
    </div>

    <div class="sec-title">图片分享</div>
    <div class="row">
      <select id="provSelect" style="flex:1;min-width:0"></select>
      <button id="dlProvBtn">下载该省 PNG</button>
    </div>
    <div class="row">
      <button id="dlAllBtn" style="width:100%">下载全国地图 PNG</button>
    </div>
  </div>
  <div class="p-foot">直辖市与港澳按整体展示；海南含省直辖县级单位。Demo 仅供原型使用，正式对外发布请使用自然资源部标准地图并复核边界。</div>
</div>

<div id="authModal">
  <div class="auth-box">
    <h2 id="authTitle">登录</h2>
    <input type="text" id="authUser" placeholder="用户名（3-32 位）">
    <input type="password" id="authPass" placeholder="密码（6-64 位）">
    <div class="row">
      <button id="authCancel">取消</button>
      <button class="primary" id="authSubmit">登录</button>
    </div>
    <div id="authMsg"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ==================== 配置 ==================== */
const MUNICIPALITIES = [110000, 120000, 310000, 500000, 810000, 820000];  // 京津沪渝港澳：整体
const PROVINCES = [   // 普通省：_full 取下级（地级市），失败回退为自身
  130000,140000,150000,210000,220000,230000,320000,330000,340000,350000,
  360000,370000,410000,420000,430000,440000,450000,460000,510000,520000,
  530000,540000,610000,620000,630000,640000,650000,710000
];
const ALL_PROVINCES = [...MUNICIPALITIES, ...PROVINCES];
const DATAV = c => `https://geo.datav.aliyun.com/areas_v3/bound/${c}.json`;
const DATAV_FULL = c => `https://geo.datav.aliyun.com/areas_v3/bound/${c}_full.json`;
const PRESET_COLORS = ['#5470c6','#91cc75','#fac858','#ee6666','#73c0de',
  '#3ba272','#fc8452','#9a60b4','#ea7ccc','#f56c6c','#e6a23c','#909399'];
const DEFAULT_FILL = '#e9edf2';
const PROV_BORDER = { color: '#7aaede', weight: 2, opacity: .95 };  // 淡蓝细线省界
const LS_KEY = 'chinaCityColorMap_v2';
const ZOOM_THRESHOLD = 6;         // 缩小 <6 只显示省名；放大 >=6 显示地级市名
const EXPORT_SOUTH_CUT = 15.5;    // 三沙远南小岛截断

/* ==================== 认证 ==================== */
const AUTH = {
  token: localStorage.getItem('cm_token') || '',
  user: localStorage.getItem('cm_user') || ''
};
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (AUTH.token) headers['Authorization'] = 'Bearer ' + AUTH.token;
  let r;
  try {
    r = await fetch(path, { ...opts, headers });
  } catch (e) {
    throw new Error('无法连接服务器：请确认已通过 python app.py 启动，并访问 http://localhost:5000（而非直接双击 html 文件）');
  }
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) setAuth('', '');
  if (!r.ok) throw new Error(data.error || ('请求失败（HTTP ' + r.status + '）'));
  return data;
}
function setAuth(token, user) {
  AUTH.token = token; AUTH.user = user;
  if (token) {
    localStorage.setItem('cm_token', token);
    localStorage.setItem('cm_user', user);
  } else {
    localStorage.removeItem('cm_token');
    localStorage.removeItem('cm_user');
  }
  refreshAuthUI();
}
function refreshAuthUI() {
  const loggedIn = !!AUTH.token;
  document.getElementById('authStatus').textContent = loggedIn ? '👤 ' + AUTH.user : '未登录（可本地编辑）';
  document.getElementById('loginBtn').style.display = loggedIn ? 'none' : '';
  document.getElementById('registerBtn').style.display = loggedIn ? 'none' : '';
  document.getElementById('logoutBtn').style.display = loggedIn ? '' : 'none';
  loadProjList();
}

/* ==================== 全局状态 ==================== */
const map = L.map('map', { zoomControl: true, attributionControl: false, minZoom: 3, maxZoom: 12 });
map.setView([36.5, 108], 4);
map.setMaxBounds([[0, 55], [60, 145]]);
let geoLayer = null;
let allFeatures = [];      // 地级行政区
let provPolys = [];        // 省级行政区面（自身边界）
let provList = [];         // 由城市数据推导的省份列表
const colorMap = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
let selected = null;
const cityItems = new Map();
let cityLabelLayer = null, provLabelLayer = null;

/* ==================== 数据加载 ==================== */
async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadGeo() {
  const status = document.getElementById('status');
  allFeatures = []; provPolys = []; provList = [];
  // 优先读本地 /geo/（零外部依赖），失败再回退 DataV 在线接口
  const LOCAL = n => `/geo/${n}.json`;
  const jobs = [];
  // 地级市
  MUNICIPALITIES.forEach(c => jobs.push({
    kind: 'city',
    p: fetchJSON(LOCAL(c)).catch(() => fetchJSON(DATAV(c)).catch(() => null))
  }));
  PROVINCES.forEach(c => jobs.push({
    kind: 'city',
    p: fetchJSON(LOCAL(c + '_full'))
         .catch(() => fetchJSON(DATAV_FULL(c)).catch(() => fetchJSON(DATAV(c)).catch(() => null)))
  }));
  // 省份轮廓（淡蓝省界用）
  ALL_PROVINCES.forEach(c => jobs.push({
    kind: 'prov',
    p: fetchJSON(LOCAL('p' + c)).catch(() => fetchJSON(DATAV(c)).catch(() => null))
  }));
  const results = await Promise.all(jobs.map(j => j.p));
  let fail = 0;
  jobs.forEach((j, i) => {
    const res = results[i];
    if (res && Array.isArray(res.features)) {
      res.features.forEach(f => {
        if (f && f.properties && f.properties.adcode) {
          (j.kind === 'city' ? allFeatures : provPolys).push(f);
        }
      });
    } else fail++;
  });
  provList = buildProvList();
  fillProvSelect();
  if (!allFeatures.length) {
    status.innerHTML = '❌ 地图数据加载失败（本地 geo/ 数据缺失且无法访问 DataV）<button onclick="loadGeo()">重试</button>';
    return;
  }
  status.textContent = `一纸山河 v4.1 · 已加载 ${allFeatures.length} 个地级行政区` + (fail ? `（${fail} 个来源失败）` : '');
  render();
}

/* ==================== 省份推导（不依赖全国接口） ==================== */
const PROV_NAMES = {
  110000:'北京市',120000:'天津市',130000:'河北省',140000:'山西省',150000:'内蒙古自治区',
  210000:'辽宁省',220000:'吉林省',230000:'黑龙江省',310000:'上海市',320000:'江苏省',
  330000:'浙江省',340000:'安徽省',350000:'福建省',360000:'江西省',370000:'山东省',
  410000:'河南省',420000:'湖北省',430000:'湖南省',440000:'广东省',450000:'广西壮族自治区',
  460000:'海南省',500000:'重庆市',510000:'四川省',520000:'贵州省',530000:'云南省',
  540000:'西藏自治区',610000:'陕西省',620000:'甘肃省',630000:'青海省',640000:'宁夏回族自治区',
  650000:'新疆维吾尔自治区',710000:'台湾省',810000:'香港特别行政区',820000:'澳门特别行政区'
};
function cityProvCode(f) {
  const p = f.properties;
  return (p.parent && p.parent.adcode && p.parent.adcode !== 100000) ? p.parent.adcode : p.adcode;
}
function buildProvList() {
  const m = new Map();
  allFeatures.forEach(f => {
    const pc = cityProvCode(f);
    if (!m.has(pc)) m.set(pc, { adcode: pc, name: PROV_NAMES[pc] || String(pc), members: [] });
    m.get(pc).members.push(f);
  });
  return [...m.values()].sort((a, b) => a.adcode - b.adcode);
}
function provCentroid(prov) {
  let sx = 0, sy = 0, n = 0;
  prov.members.forEach(f => {
    const ll = f.properties.centroid || f.properties.center;
    if (!ll || ll[1] < EXPORT_SOUTH_CUT) return;
    sx += ll[0]; sy += ll[1]; n++;
  });
  if (!n) prov.members.forEach(f => {
    const ll = f.properties.centroid || f.properties.center;
    if (ll) { sx += ll[0]; sy += ll[1]; n++; }
  });
  return n ? [sx / n, sy / n] : null;
}
function fillProvSelect() {
  const sel = document.getElementById('provSelect');
  if (!sel) return;
  sel.innerHTML = '';
  provList.forEach(p => {
    const o = document.createElement('option');
    o.value = p.adcode;
    o.textContent = p.name;
    sel.appendChild(o);
  });
}

/* ==================== 渲染 ==================== */
function styleFn(f) {
  return { fillColor: colorMap[f.properties.adcode] || DEFAULT_FILL, weight: 1, color: '#ffffff', fillOpacity: 1 };
}
function render() {
  geoLayer = L.geoJSON({ type: 'FeatureCollection', features: allFeatures }, {
    style: styleFn,
    onEachFeature: (f, layer) => layer.on('click', () => select(f, layer))
  }).addTo(map);
  // 省界：淡蓝细线（省份自身面整体描边，无匹配计算，永不断线）
  if (provPolys.length) {
    L.geoJSON({ type: 'FeatureCollection', features: provPolys }, {
      style: { color: PROV_BORDER.color, weight: PROV_BORDER.weight, opacity: PROV_BORDER.opacity, fillOpacity: 0, fill: false },
      interactive: false
    }).addTo(map);
  }
  buildLabels();
  updateLabels();
  map.on('zoomend', updateLabels);
  buildList('');
  document.getElementById('count').textContent = allFeatures.length;
}

/* ==================== 标注：permanent tooltip 挂在图层组上 ==================== */
function makeTip(ll, text, cls) {
  const m = L.marker([ll[1], ll[0]], { opacity: 0, interactive: false });
  m.bindTooltip(text, { permanent: true, interactive: false, direction: 'center', className: cls });
  return m;
}
function buildLabels() {
  cityLabelLayer = L.layerGroup(allFeatures
    .map(f => {
      const ll = f.properties.centroid || f.properties.center;
      return ll ? makeTip(ll, f.properties.name, 'lbl-city') : null;
    })
    .filter(Boolean));
  provLabelLayer = L.layerGroup(provList
    .map(p => {
      const ll = provCentroid(p);
      return ll ? makeTip(ll, p.name, 'lbl-prov') : null;
    })
    .filter(Boolean));
}
function updateLabels() {
  const zoomedIn = map.getZoom() >= ZOOM_THRESHOLD;
  const has = lyr => lyr && map.hasLayer(lyr);
  if (zoomedIn) {
    if (!has(cityLabelLayer)) cityLabelLayer.addTo(map);
    if (has(provLabelLayer)) map.removeLayer(provLabelLayer);
  } else {
    if (!has(provLabelLayer)) provLabelLayer.addTo(map);
    if (has(cityLabelLayer)) map.removeLayer(cityLabelLayer);
  }
}

/* ==================== 选中与上色 ==================== */
function select(f, layer, fromList) {
  if (selected && selected.layer) selected.layer.setStyle({ weight: 1, color: '#fff' });
  selected = { f, layer };
  if (layer) { layer.setStyle({ weight: 3, color: '#303133' }); layer.bringToFront(); }
  updateSelInfo();
  if (fromList && layer) map.flyToBounds(layer.getBounds(), { padding: [60, 60], maxZoom: 8 });
  cityItems.forEach(el => el.classList.remove('active'));
  const item = cityItems.get(f.properties.adcode);
  if (item) { item.classList.add('active'); item.scrollIntoView({ block: 'nearest' }); }
}
function updateSelInfo() {
  const box = document.getElementById('selInfo');
  if (!selected) { box.innerHTML = '<span class="none">在地图或列表中点击一个城市</span>'; return; }
  const p = selected.f.properties;
  const color = colorMap[p.adcode];
  box.innerHTML = `<b>${p.name}</b><br>adcode：${p.adcode}<br>当前颜色：<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${color || DEFAULT_FILL};vertical-align:-1px;border:1px solid #ddd"></span> ${color || '未设置'}`;
}
function findLayer(adcode) {
  let found = null;
  geoLayer.eachLayer(l => { if (l.feature.properties.adcode === adcode) found = l; });
  return found;
}
function applyColor(adcode, color) {
  if (!adcode) return;
  if (color) colorMap[adcode] = color; else delete colorMap[adcode];
  localStorage.setItem(LS_KEY, JSON.stringify(colorMap));
  const layer = findLayer(adcode);
  if (layer) layer.setStyle({ fillColor: color || DEFAULT_FILL });
  const item = cityItems.get(adcode);
  if (item) item.querySelector('.dot').style.background = color || DEFAULT_FILL;
  updateSelInfo();
}
function applyAllColors() {
  localStorage.setItem(LS_KEY, JSON.stringify(colorMap));
  geoLayer.eachLayer(l => l.setStyle({ fillColor: colorMap[l.feature.properties.adcode] || DEFAULT_FILL }));
  cityItems.forEach((el, adcode) => { el.querySelector('.dot').style.background = colorMap[adcode] || DEFAULT_FILL; });
  updateSelInfo();
}

/* ==================== 城市列表 ==================== */
function buildList(keyword) {
  const box = document.getElementById('cityList');
  box.innerHTML = ''; cityItems.clear();
  const kw = keyword.trim().toLowerCase();
  allFeatures
    .filter(f => !kw || f.properties.name.toLowerCase().includes(kw) || String(f.properties.adcode).includes(kw))
    .sort((a, b) => a.properties.adcode - b.properties.adcode)
    .forEach(f => {
      const p = f.properties;
      const div = document.createElement('div');
      div.className = 'city-item';
      div.innerHTML = `<span class="dot" style="background:${colorMap[p.adcode] || DEFAULT_FILL}"></span>${p.name}<span class="code">${p.adcode}</span>`;
      div.onclick = () => { const l = findLayer(p.adcode); select(f, l, true); };
      box.appendChild(div);
      cityItems.set(p.adcode, div);
    });
}

/* ==================== 地图检索（自动补全 + 键盘导航） ==================== */
const msInput = document.getElementById('mapSearchInput');
const msDrop = document.getElementById('searchDrop');
let msIndex = -1, msResults = [];
function msDoSearch() {
  const kw = msInput.value.trim().toLowerCase();
  msIndex = -1;
  if (!kw) { msDrop.style.display = 'none'; msDrop.innerHTML = ''; return; }
  msResults = allFeatures
    .filter(f => f.properties.name.toLowerCase().includes(kw) || String(f.properties.adcode).includes(kw))
    .sort((a, b) => a.properties.adcode - b.properties.adcode)
    .slice(0, 15);
  if (!msResults.length) {
    msDrop.innerHTML = '<div class="search-empty">无匹配城市</div>';
    msDrop.style.display = 'block';
    return;
  }
  msDrop.innerHTML = '';
  msResults.forEach((f, i) => {
    const p = f.properties;
    const div = document.createElement('div');
    div.className = 'search-item';
    div.innerHTML = `<span class="dot" style="background:${colorMap[p.adcode] || DEFAULT_FILL}"></span>${p.name}<span class="code">${p.adcode}</span>`;
    div.onmousedown = () => msPick(i);
    msDrop.appendChild(div);
  });
  msDrop.style.display = 'block';
}
function msPick(i) {
  const f = msResults[i];
  if (!f) return;
  msDrop.style.display = 'none';
  msInput.blur();
  select(f, findLayer(f.properties.adcode), true);
}
let msTimer = null;
msInput.oninput = () => { clearTimeout(msTimer); msTimer = setTimeout(msDoSearch, 200); };
msInput.onfocus = () => { if (msInput.value.trim()) msDoSearch(); };
msInput.onblur = () => setTimeout(() => { msDrop.style.display = 'none'; }, 150);
msInput.onkeydown = e => {
  const open = msDrop.style.display === 'block';
  if (e.key === 'Enter') {
    e.preventDefault();
    if (!open) { msDoSearch(); return; }
    msPick(msIndex >= 0 ? msIndex : 0);
    return;
  }
  if (!open) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); msIndex = (msIndex + 1) % msResults.length; }
  else if (e.key === 'ArrowUp') { e.preventDefault(); msIndex = (msIndex - 1 + msResults.length) % msResults.length; }
  else if (e.key === 'Escape') { msDrop.style.display = 'none'; return; }
  else return;
  const items = msDrop.querySelectorAll('.search-item');
  items.forEach((el, i) => el.classList.toggle('active', i === msIndex));
  if (items[msIndex]) items[msIndex].scrollIntoView({ block: 'nearest' });
};

/* ==================== 云端项目 ==================== */
async function loadProjList() {
  const box = document.getElementById('projList');
  if (!AUTH.token) { box.innerHTML = '<div class="proj-item" style="color:#c0c4cc">登录后显示已保存的项目</div>'; return; }
  try {
    const list = await api('/api/projects');
    if (!list.length) { box.innerHTML = '<div class="proj-item" style="color:#c0c4cc">暂无项目，保存一个吧</div>'; return; }
    box.innerHTML = '';
    list.forEach(p => {
      const div = document.createElement('div');
      div.className = 'proj-item';
      div.innerHTML = `<span class="pname" title="${p.name}">${p.name}</span><span class="ptime">${p.updated_at}</span>`;
      const loadBtn = document.createElement('button');
      loadBtn.textContent = '加载';
      loadBtn.onclick = () => loadProject(p.id);
      const delBtn = document.createElement('button');
      delBtn.textContent = '删除';
      delBtn.className = 'danger';
      delBtn.onclick = async () => {
        if (!confirm(`删除项目「${p.name}」？`)) return;
        try { await api('/api/projects/' + p.id, { method: 'DELETE' }); loadProjList(); }
        catch (e) { alert(e.message); }
      };
      div.appendChild(loadBtn); div.appendChild(delBtn);
      box.appendChild(div);
    });
  } catch (e) {
    box.innerHTML = `<div class="proj-item" style="color:#f56c6c">${e.message}</div>`;
  }
}
async function loadProject(pid) {
  try {
    const proj = await api('/api/projects/' + pid);
    Object.keys(colorMap).forEach(k => delete colorMap[k]);
    Object.assign(colorMap, proj.colors || {});
    applyAllColors();
    document.getElementById('projName').value = proj.name;
    alert(`已加载项目「${proj.name}」，可继续编辑后再次保存（同名覆盖）`);
  } catch (e) { alert(e.message); }
}
document.getElementById('saveProjBtn').onclick = async () => {
  if (!AUTH.token) return alert('请先登录');
  const name = document.getElementById('projName').value.trim();
  if (!name) return alert('请填写项目名称');
  try {
    await api('/api/projects', { method: 'POST', body: JSON.stringify({ name, colors: colorMap }) });
    alert(`项目「${name}」已保存`);
    loadProjList();
  } catch (e) { alert(e.message); }
};

/* ==================== 登录 / 注册弹窗 ==================== */
let authMode = 'login';
const modal = document.getElementById('authModal');
function openAuth(mode) {
  authMode = mode;
  document.getElementById('authTitle').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('authSubmit').textContent = mode === 'login' ? '登录' : '注册';

document.getElementById('authCancel').onclick = () => modal.classList.remove('show');

  const username = document.getElementById('authUser').value.trim();
  const password = document.getElementById('authPass').value;
  const msg = document.getElementById('authMsg');
  try {
    const data = await api('/api/' + authMode, { method: 'POST', body: JSON.stringify({ username, password }) });
    setAuth(data.token, data.username);
    modal.classList.remove('show');
  } catch (e) { msg.textContent = e.message; }

document.getElementById('logoutBtn').onclick = async () => {
  try { await api('/api/logout', { method: 'POST' }); } catch (e) {}

/* ==================== 配色面板 ==================== */
const palette = document.getElementById('palette');
PRESET_COLORS.forEach(c => {
  const s = document.createElement('div');
  s.className = 'swatch'; s.style.background = c; s.title = c;
  s.onclick = () => selected ? applyColor(selected.f.properties.adcode, c) : alert('请先选择一个城市');
  palette.appendChild(s);
});
document.getElementById('applyBtn').onclick = () => {

  applyColor(selected.f.properties.adcode, document.getElementById('customColor').value);
};
document.getElementById('clearBtn').onclick = () => {
  if (selected) applyColor(selected.f.properties.adcode, null);
};
document.getElementById('search').oninput = e => buildList(e.target.value);
document.getElementById('exportBtn').onclick = () => {
  const data = allFeatures
    .filter(f => colorMap[f.properties.adcode])
    .map(f => ({ adcode: f.properties.adcode, name: f.properties.name, color: colorMap[f.properties.adcode] }))
    .sort((a, b) => a.adcode - b.adcode);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'city_colors.json'; a.click();
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const arr = JSON.parse(reader.result);
      arr.forEach(d => { if (d.adcode && d.color) colorMap[d.adcode] = d.color; });
      applyAllColors();
    } catch { alert('文件格式错误，应为 [{adcode, name, color}, ...]'); }
  };
  reader.readAsText(file);
};
document.getElementById('randomBtn').onclick = () => {
  if (!selected) return alert('请先选择一个城市');
  applyColor(selected.f.properties.adcode, PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)]);
};
document.getElementById('clearAllBtn').onclick = () => {
  if (!confirm('确定清空全部配色？')) return;
  Object.keys(colorMap).forEach(k => delete colorMap[k]);
  applyAllColors();
};

/* ==================== 图片导出（Canvas 离屏重绘 + 网址水印） ==================== */
const WATERMARK_URL = (window.location.origin && window.location.origin !== 'null')
  ? window.location.origin : 'your-site.com';

function makeCanvas(W, H, dpr) {
  const canvas = document.createElement('canvas');
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#f5f7fa';
  ctx.fillRect(0, 0, W, H);
  return { canvas, ctx };
}
function drawFeatures(ctx, features, toXY, southCut) {
  features.forEach(f => {
    const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
    const fillC = colorMap[f.properties.adcode] || DEFAULT_FILL;
    polys.forEach(rings => {
      if (southCut !== undefined) {
        let maxLat = -90;
        rings[0].forEach(p => { if (p[1] > maxLat) maxLat = p[1]; });
        if (maxLat < southCut) return;
      }
      ctx.beginPath();
      rings.forEach(ring => {
        ring.forEach((p, i) => {
          const [x, y] = toXY(p[0], p[1]);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.closePath();
      });
      ctx.fillStyle = fillC;
      ctx.fill('evenodd');
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  });
}
function strokeFeaturesOutline(ctx, features, toXY, color, width, southCut) {
  ctx.beginPath();
  features.forEach(f => {
    const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
    polys.forEach(rings => {
      if (southCut !== undefined) {
        let maxLat = -90;
        rings[0].forEach(p => { if (p[1] > maxLat) maxLat = p[1]; });
        if (maxLat < southCut) return;
      }
      rings.forEach(ring => {
        ring.forEach((p, i) => {
          const [x, y] = toXY(p[0], p[1]);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.closePath();
      });
    });
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineJoin = 'round';
  ctx.stroke();
}
function drawLabel(ctx, text, x, y, font, color, align) {
  ctx.font = font;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,.92)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
const PROJECT_NAME = '一纸山河';
function drawWatermark(ctx, W, H) {
  // 仅右下角：项目名 + 网址，两行右对齐
  const urlFont = Math.round(W / 58);
  const nameFont = Math.round(W / 46);
  const pad = 12, gap = 4;
  ctx.save();
  ctx.textAlign = 'right';
  ctx.globalAlpha = 0.9;
  // 项目名（加粗）
  ctx.font = '700 ' + nameFont + 'px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = '#374151';
  ctx.textBaseline = 'bottom';
  ctx.fillText(PROJECT_NAME, W - pad, H - pad - urlFont - gap);
  // 网址
  ctx.font = urlFont + 'px sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText(WATERMARK_URL, W - pad, H - pad);
  ctx.restore();
}
function downloadCanvas(canvas, filename) {
  canvas.toBlob(blob => {
    if (!blob) return alert('导出失败：浏览器未能生成图片');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
}

function exportWholeMap() {
  if (!allFeatures.length) return alert('地图尚未加载完成，请稍候');
  const bounds = { minLon: 72, maxLon: 136, minLat: EXPORT_SOUTH_CUT, maxLat: 54.5 };
  const pxPerDeg = 16, dpr = 2;
  const W = Math.round((bounds.maxLon - bounds.minLon) * pxPerDeg);
  const H = Math.round((bounds.maxLat - bounds.minLat) * pxPerDeg);
  const { canvas, ctx } = makeCanvas(W, H, dpr);
  const toXY = (lon, lat) => [
    (lon - bounds.minLon) / (bounds.maxLon - bounds.minLon) * W,
    (bounds.maxLat - lat) / (bounds.maxLat - bounds.minLat) * H
  ];
  drawFeatures(ctx, allFeatures, toXY, EXPORT_SOUTH_CUT);
  if (provPolys.length) strokeFeaturesOutline(ctx, provPolys, toXY, '#5b8fc4', 2, EXPORT_SOUTH_CUT);
  const pf = Math.max(11, Math.round(W / 72));
  provList.forEach(p => {
    const ll = provCentroid(p);
    if (!ll || ll[1] < EXPORT_SOUTH_CUT) return;
    const [x, y] = toXY(ll[0], ll[1]);
    drawLabel(ctx, p.name, x, y, '700 ' + pf + 'px "PingFang SC","Microsoft YaHei",sans-serif', '#1f2329');
  });
  drawWatermark(ctx, W, H);
  downloadCanvas(canvas, 'china_map.png');
}

function exportProvince(provCode) {
  if (!allFeatures.length) return alert('地图尚未加载完成，请稍候');
  const cities = allFeatures.filter(f => cityProvCode(f) === provCode);
  const prov = provList.find(p => p.adcode === provCode);
  const provPoly = provPolys.find(f => f.properties.adcode === provCode);
  if (!cities.length && !prov) return alert('未找到该省数据');
  let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
  const eat = (lon, lat) => {
    if (lat < EXPORT_SOUTH_CUT) return;
    if (lon < minLon) minLon = lon;
    if (lon > maxLon) maxLon = lon;
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
  };
  const src = cities.length ? cities : [provPoly || allFeatures.find(f => f.properties.adcode === provCode)].filter(Boolean);
  if (!src.length) return alert('未找到该省边界数据');
  src.forEach(f => {
    const polys = f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates : [f.geometry.coordinates];
    polys.forEach(rings => rings.forEach(ring => ring.forEach(p => eat(p[0], p[1]))));
  });
  const padLon = Math.max((maxLon - minLon) * 0.06, 0.01), padLat = Math.max((maxLat - minLat) * 0.06, 0.01);
  minLon -= padLon; maxLon += padLon; minLat -= padLat; maxLat += padLat;
  const W = 1200, dpr = 2;
  const H = Math.max(1, Math.round(W * (maxLat - minLat) / Math.max(maxLon - minLon, 0.01)));
  const { canvas, ctx } = makeCanvas(W, H, dpr);
  const toXY = (lon, lat) => [
    (lon - minLon) / (maxLon - minLon) * W,
    (maxLat - lat) / (maxLat - minLat) * H
  ];
  drawFeatures(ctx, src, toXY, EXPORT_SOUTH_CUT);
  if (provPoly) strokeFeaturesOutline(ctx, [provPoly], toXY, '#5b8fc4', 3, EXPORT_SOUTH_CUT);
  const cf = Math.min(16, Math.max(10, Math.round(W / Math.max(maxLon - minLon, 0.01) * 0.85)));
  src.forEach(f => {
    const ll = f.properties.centroid || f.properties.center;
    if (!ll || ll[1] < EXPORT_SOUTH_CUT) return;
    const [x, y] = toXY(ll[0], ll[1]);
    drawLabel(ctx, f.properties.name, x, y, cf + 'px "PingFang SC","Microsoft YaHei",sans-serif', '#374151');
  });
  drawLabel(ctx, (prov ? prov.name : src[0].properties.name), 16, 24,
    '700 22px "PingFang SC","Microsoft YaHei",sans-serif', '#1f2329', 'left');
  drawWatermark(ctx, W, H);
  downloadCanvas(canvas, (prov ? prov.name : 'map') + '.png');
}

document.getElementById('dlAllBtn').onclick = () => {
  try { exportWholeMap(); } catch (e) { alert('导出失败：' + e.message); }
};
document.getElementById('dlProvBtn').onclick = () => {
  try { exportProvince(+document.getElementById('provSelect').value); } catch (e) { alert('导出失败：' + e.message); }
};
